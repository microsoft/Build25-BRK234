---
name: Python package installation check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_package:
    name: Test ${{ matrix.os }} Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python_version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python_version }}
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
      - name: Install app in editable mode
        run: |
          python -m pip install -e src
      - name: Verify package installation
        run: |
          python -c "import quartapp; print('Package imported!')"
          python -c "from quartapp import create_app; print('create_app OK!')"
          python -c "import quartapp.chat; print('quartapp.chat imported!')"
          python -c "import quartapp; app = quartapp.create_app(); print('App created!')"
